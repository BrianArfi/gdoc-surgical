<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#F1F3EE; --field:#0D453E; --ink:#072B27; --signal:#C8F751; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 800px; height: 450px; background: var(--paper); overflow: hidden; }
  body { padding: 14px 18px 20px 14px; font-family: 'JetBrains Mono', Consolas, monospace; }
  .win { height: 416px; background: var(--ink); border-radius: 12px; border: 3px solid var(--ink);
         box-shadow: 7px 7px 0 var(--field); display: flex; flex-direction: column; overflow: hidden; }
  .chrome { height: 32px; background: #0A3833; display: flex; align-items: center; padding: 0 14px; gap: 8px; }
  .chrome i { width: 12px; height: 12px; border-radius: 50%; background: #2C5C55; display: block; }
  .chrome span { margin-left: 12px; color: #9DB7AF; font-size: 13px; }
  .chrome b { margin-left: auto; font-family: 'Archivo', sans-serif; font-size: 13px; color: var(--ink);
              background: var(--signal); padding: 3px 9px; border-radius: 5px; }
  .screen { flex: 1; padding: 10px 12px; color: #DDE7E2; font-size: 15px; line-height: 1.4;
            display: flex; flex-direction: column; justify-content: flex-start; overflow: hidden; letter-spacing: -0.2px; }
  .l { white-space: pre-wrap; word-break: break-word; min-height: 1.4em; flex-shrink: 0; }
  .old { outline: 2px dashed #9DB7AF; outline-offset: 1px; border-radius: 3px; }
  .prompt { color: var(--signal); }
  .cmd { color: #fff; }
  .ok { color: var(--signal); font-weight: 700; }
  .info { color: #9DB7AF; }
  .hl { background: var(--signal); color: var(--ink); padding: 0 3px; border-radius: 3px; font-weight: 700; }
  .keep { background: #164F47; border-left: 3px solid var(--signal); margin-left: -8px; padding-left: 5px; }
  .note { color: var(--ink); background: var(--signal); font-family: 'Archivo', sans-serif; font-size: 13px;
          padding: 0 6px; border-radius: 4px; margin-left: 8px; white-space: nowrap; }
  .cursor { display: inline-block; width: 9px; height: 17px; background: var(--signal); vertical-align: -3px; }
</style>
</head>
<body>
<div class="win">
  <div class="chrome"><i></i><i></i><i></i><span>gdoc-surgical, offline sample doc</span><b>real output</b></div>
  <div class="screen" id="s"></div>
</div>
<script>
// Real output captured from docs/src/offline_demo.py, see demo_session.json.
const SESSION = __SESSION__;
const CHAR_MS = 14, PAUSE_AFTER_CMD = 300, LINE_MS = 80, GAP = 1300, END_HOLD = 2600, MAX_LINES = 16;

function esc(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function deco(line, step) {
  let h = esc(line);
  if (line.startsWith('[OK]')) return '<span class="ok">[OK]</span>' + h.slice(4).replace('3 occurrence(s)', '<span class="hl">3 occurrence(s)</span>');
  if (line.startsWith('[INFO]')) return '<span class="info">' + h + '</span>';
  if (step === 0 && line.includes("Q3 2026")) return h.replace("Q3 2026", "<span class=\"old\">Q3 2026</span>");
  if (step === 2) {
    if (line.includes('Q4 2026')) return h.replace('Q4 2026', '<span class="hl">Q4 2026</span>') + '<span class="note">changed</span>';
    if (line.includes('Dina, Leo')) return h;
    if (line.includes('added by Dina')) return '<span class="keep">' + h + '</span><span class="note">kept</span>';
  }
  return h;
}
// Build a timeline of states: each event at a time t (ms).
const events = []; let t = 0;
SESSION.forEach((s, i) => {
  if (i === 0) { events.push({t:0, step:0, typed:s.cmd.length, lines:s.out.split('\n').length}); t = 1800; return; }
  for (let c = 0; c <= s.cmd.length; c++) { events.push({t, step:i, typed:c, lines:0}); t += CHAR_MS; }
  t += PAUSE_AFTER_CMD;
  const lines = s.out.split('\n');
  for (let k = 1; k <= lines.length; k++) { events.push({t, step:i, typed:s.cmd.length, lines:k}); t += LINE_MS; }
  t += GAP;
});
window.TOTAL_MS = t - GAP + END_HOLD;

window.renderAt = function(ms) {
  let ev = events[0];
  for (const e of events) { if (e.t <= ms) ev = e; else break; }
  const out = [];
  for (let i = 0; i <= ev.step; i++) {
    const s = SESSION[i];
    const done = i < ev.step;
    const typed = done ? s.cmd.length : ev.typed;
    const showCursor = !done && ev.lines === 0;
    out.push('<div class="l"><span class="prompt">$ </span><span class="cmd">' + esc(s.cmd.slice(0, typed)) + '</span>' + (showCursor ? '<span class="cursor"></span>' : '') + '</div>');
    const lines = s.out.split('\n');
    const n = done ? lines.length : ev.lines;
    for (let k = 0; k < n; k++) out.push('<div class="l">' + deco(lines[k], i) + '</div>');
  }
  const finished = ev.step === SESSION.length - 1 && ev.lines === SESSION[ev.step].out.split('\n').length;
  if (finished) out.push('<div class="l"><span class="prompt">$ </span><span class="cursor"></span></div>');
  const el = document.getElementById('s');
  el.innerHTML = out.join('');
  while (el.scrollHeight > el.clientHeight && el.firstChild) el.removeChild(el.firstChild);
};
</script>
</body>
</html>
